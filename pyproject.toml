[build-system]
requires = ["maturin >= 1.9"]
build-backend = "maturin"

[project]
name = "rustling"
description = "A high-performance library for computational linguistics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [ { name = "Jackson L. Lee", email = "jacksonlunlee@gmail.com" } ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version", "keywords"]

[project.urls]
Source = "https://github.com/jacksonllee/rustling"

[tool.maturin]
features = ["extension-module", "parallel"]
python-source = "python"
module-name = "rustling._lib_name"
python-packages = ["rustling"]

[tool.pytest.ini_options]
addopts = "-vv --strict-markers -m 'not benchmark'"
testpaths = ["python/tests"]
markers = [
    "benchmark: benchmark regression tests (deselected by default, run with: pytest -m benchmark)",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "black >= 26.1.0",
    "flake8 >= 7.3.0",
    "mypy >= 1.19.1",
    "pytest >= 9.0.2",
]
docs = [
    "sphinx >= 8.1.3",
    "pydata-sphinx-theme >= 0.16.1",
    "sphinx-autoapi >= 3.4.0",
    "sphinx-copybutton >= 0.5.2",
]
benchmarks = [
    "wordseg >= 0.0.5",
    "pycantonese @ git+https://github.com/jacksonllee/pycantonese.git@3485a6c78495d1415d5228b2c94dd1a37c58ed9a",
    "nltk >= 3.8",
    "pylangacq @ git+https://github.com/jacksonllee/pylangacq.git@5161b686296d905d5226c9a4e126834ddbf669f5",
    "hmmlearn == 0.3.3",
    "numpy",
    "pympi-ling == 1.70.2",
    "conllu == 6.0.0",
]
