[package]
name = "rustling"
version = "0.9.0"
edition = "2024"
description = "A high-performance library for computational linguistics"
license = "MIT"
repository = "https://github.com/jacksonllee/rustling"
documentation = "https://docs.rs/rustling"
readme = "README.md"
# Releases are on hold while CHAT parsing depends on the git-pinned TalkBank
# chatter crates (talkbank-model / talkbank-parser): crates.io rejects git
# dependencies outright, and we hold PyPI releases too so the two registries
# stay in lockstep. This branch is therefore not merged into main or released;
# it demonstrates the chatter integration until chatter ships to crates.io
# (planned for its 1.0 release), at which point the git deps become version
# deps, this line is removed, and the publish jobs are re-enabled. `publish =
# false` guards against an accidental `cargo publish`; it does not affect
# maturin/PyPI wheel building, which git dependencies do not block.
publish = false
keywords = [
    # At most 5 keywords per crate. Each keyword must have fewer than 20 characters.
    "linguistics",
    "nlp", 
    "text-processing",
]
categories = ["science", "text-processing"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rustling"
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py310"], optional = true }
rand = "0.10"
rayon = { version = "1.10", optional = true }
fancy-regex = "0.17"
regex = "1"
rustc-hash = "2.1"
flatbuffers = "25.12.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "8"
quick-xml = { version = "0.41", features = ["serialize"] }
zstd = "0.13"
# Official TalkBank CHAT model + parser. Pinned to a git tag until chatter is
# published to crates.io (planned for its 1.0 release). talkbank-model is the
# typed CHAT AST + validation (pure Rust, wasm-clean); the parser backend is
# target-gated below (tree-sitter natively, pure-Rust re2c on wasm).
talkbank-model = { git = "https://github.com/TalkBank/chatter", tag = "v0.3.6" }

# Native targets use the official tree-sitter-backed parser (compiles C via cc).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
talkbank-parser = { git = "https://github.com/TalkBank/chatter", tag = "v0.3.6" }

# WASM (Pyodide/emscripten) uses the pure-Rust re2c parser to avoid compiling
# tree-sitter's C runtime under emscripten.
[target.'cfg(target_family = "wasm")'.dependencies]
talkbank-parser-re2c = { git = "https://github.com/TalkBank/chatter", tag = "v0.3.6" }

[dev-dependencies]
tempfile = "3"

[features]
default = ["parallel"]
extension-module = ["pyo3", "pyo3/extension-module"]
parallel = ["rayon"]
