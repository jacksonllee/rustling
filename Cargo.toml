[package]
name = "rustling"
version = "0.9.0"
edition = "2024"
description = "A high-performance library for computational linguistics"
license = "MIT"
repository = "https://github.com/jacksonllee/rustling"
documentation = "https://docs.rs/rustling"
readme = "README.md"
keywords = [
    # At most 5 keywords per crate. Each keyword must have fewer than 20 characters.
    "linguistics",
    "nlp", 
    "text-processing",
]
categories = ["science", "text-processing"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rustling"
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py310"], optional = true }
rand = "0.10"
rayon = { version = "1.10", optional = true }
fancy-regex = "0.19"
regex = "1"
rustc-hash = "2.1"
flatbuffers = "25.12.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "8"
quick-xml = { version = "0.41", features = ["serialize"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[features]
default = ["parallel"]
extension-module = ["pyo3", "pyo3/extension-module"]
parallel = ["rayon"]
