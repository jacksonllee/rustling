[package]
name = "rustling"
version = "0.6.0"
edition = "2024"
description = "A blazingly fast library for computational linguistics"
license = "MIT"
repository = "https://github.com/jacksonllee/rustling"
documentation = "https://docs.rs/rustling"
readme = "README.md"
keywords = [
    "computational-linguistics",
    "linguistics",
    "natural-language-processing",
    "nlp", 
    "text-processing",
    "word-segmentation",
    "part-of-speech-tagging",
    "language-models",
    "ngrams",
    "childes",
    "talkbank",
    "chat",
    "averaged-perceptron",
    "hidden-markov-model",
    "longest-string-matching",
]
categories = ["science", "text-processing"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rustling"
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.28.2", features = ["abi3-py310"] }
rand = "0.10"
rayon = { version = "1.10", optional = true }
fancy-regex = "0.17"
regex = "1"
rustc-hash = "2.1"
flatbuffers = "25.12.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "8"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[features]
default = ["parallel"]
extension-module = ["pyo3/extension-module"]
parallel = ["rayon"]
